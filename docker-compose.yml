services:
  # 1. FastAPI Production Inference & Explainability Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: endopredict_api
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    environment:
      - PORT=8000
      - MLFLOW_ALLOW_FILE_STORE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # 2. Interactive Clinical Decision Support Streamlit UI
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: endopredict_ui
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/ui/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 3. MLflow Experiment Tracking & Model Registry Server
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: endopredict_mlflow
    ports:
      - "5000:5000"
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////app/mlflow.db", "--default-artifact-root", "/app/mlruns", "--host", "0.0.0.0", "--port", "5000"]
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    restart: unless-stopped
